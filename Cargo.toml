[package]
name = "a4mp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Independently implemented adapters for model providers: one typed SDK plus optional wire codecs"
repository = "https://github.com/Unka-Malloc/Adapters-For-Model-Providers"
keywords = ["ai", "llm", "model-provider", "adapter", "sdk"]
categories = ["api-bindings", "asynchronous", "web-programming"]

[features]
default = ["reqwest-transport"]
reqwest-transport = ["dep:reqwest", "dep:futures-util"]
realtime-ws = ["dep:futures-util", "dep:tokio-tungstenite"]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
futures-core = "0.3"
rand = "0.8"
sha2 = "0.10"
futures-util = { version = "0.3", optional = true }
hmac = "0.12"
http = "1"
reqwest = { version = "0.12", optional = true, default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio-tungstenite = { version = "0.24", optional = true, features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7"
url = "2"

[dev-dependencies]
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt"] }
