# Generated release train for Adapters-For-Model-Providers.
# Regenerate from the release declaration instead of editing this file by
# hand; .github/release.lock records the source inputs that produced it.
#
# Two ways to release, one pipeline:
#
# - Weekly train: every Fri through 23:59 UTC+08:00 (Asia/Shanghai). The candidate
#   is the last commit merged into `nightly` (the default branch until the
#   repository adopts `nightly`) before the cutoff. The bump is the highest
#   `release:patch`, `release:minor` or `release:major` label among its pull
#   requests, patch when none is set. The train runs as a rehearsal.
# - Run workflow: releases the head of `nightly` (or the requested commit)
#   now, at the version typed in or bumped by the chosen level.
#
# There is deliberately no tag trigger: `publish.yml` accepts release
# inputs only from verify runs on the default branch, and a pushed tag is
# only as trustworthy as whoever pushed it. The release job creates the
# tag itself after verification.
#
# A candidate identical to the last published release is skipped. A failed
# step stops the run until a person reruns it; a rerun finishes a partly
# uploaded version instead of skipping past it.
#
# Two files split at the trust boundary. This file is the verify side: its
# `verify` job runs on every trigger with a read-only token — it selects,
# waits on siblings, verifies, versions and packages the candidate, then
# hands the `.crate` set and the release decision over as artifacts.
# `publish.yml` (the release side) is the only file that holds the OIDC
# publishing job; it runs the default branch's own copy after this verify
# train completes, so a candidate ref can never supply the workflow that
# receives the publishing identity.
#
# Credentials: this file needs none; a read-only token suffices.
name: verify

on:
  schedule:
    - cron: "0 16 * * 5"
  workflow_dispatch:
    inputs:
      version:
        description: Exact version to publish, such as 0.3.0; empty bumps by level
        required: false
        default: ""
      level:
        description: Bump level when no version is given
        type: choice
        options: [patch, minor, major]
        default: patch
      candidate:
        description: Commit or branch to release; empty takes the head of nightly
        required: false
        default: ""
      rehearse:
        description: Rehearse only; nothing is pushed, tagged or uploaded
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-train
  cancel-in-progress: false

jobs:
  verify:
    # The job name is rendered by GitHub from this workflow file, outside the
    # reach of anything a step executes: it is the signature the publish gate
    # binds the release decision to — the train's declared schedule mode and,
    # for dispatches, the rehearsal flag and version inputs. The gate refuses
    # any run whose signed name does not parse.
    name: verify-train | sched=dry-run | rehearse=${{ inputs.rehearse }} | version=${{ inputs.version || '-' }} | level=${{ inputs.level }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.version.outputs.release }}
      next: ${{ steps.version.outputs.next }}
      needs_set: ${{ steps.version.outputs.needs_set }}
      excludes: ${{ steps.version.outputs.excludes }}
      sha: ${{ steps.candidate.outputs.sha }}
      branch: ${{ steps.candidate.outputs.branch }}
    env:
      # The train's declared mode governs scheduled runs only; a manual or
      # tag event releases live unless the dispatch opted into a rehearsal.
      RELEASE_MODE: ${{ github.event_name == 'schedule' && 'dry-run' || inputs.rehearse && 'dry-run' || 'live' }}
      RELEASE_KIND: ${{ github.event_name == 'schedule' && 'train' || 'manual' }}
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_LEVEL: ${{ inputs.level }}
      SIBLINGS: '[]'
    defaults:
      run:
        shell: bash
        working-directory: Adapters-For-Model-Providers
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: Adapters-For-Model-Providers
          fetch-depth: 0

      # Copied before the candidate checkout replaces the working tree, so the
      # helper always matches this workflow.
      - name: Stage the train helper
        run: cp .github/release.py "$RUNNER_TEMP/release.py"

      - name: Select the candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE: ${{ inputs.candidate }}
        run: |
          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
          python3 "$RUNNER_TEMP/release.py" candidate --weekday=fri --time=23:59 \
            --utc-offset=+08:00 --default-branch="$default_branch" --override="$OVERRIDE"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Install the pinned toolchain
        run: |
          if [ -f rust-toolchain.toml ] || [ -f rust-toolchain ]; then
            rustup toolchain install
          fi

      - name: Wait for cross-repository dependencies
        id: deps
        run: python3 "$RUNNER_TEMP/release.py" deps --wait-minutes=150

      - name: Compute the release version
        id: version
        if: steps.deps.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ steps.candidate.outputs.sha }}
          BRANCH: ${{ steps.candidate.outputs.branch }}
        run: python3 "$RUNNER_TEMP/release.py" version --candidate="$CANDIDATE" --branch="$BRANCH"

      - name: Verify
        if: steps.version.outputs.release == 'true'
        run: |
          scripts/verify.sh
      # The bump is applied here only so the dry-run validates the exact
      # release versions; the OIDC job recreates it from the bound commit —
      # nothing a verify-runner produced crosses the OIDC boundary.
      - name: Apply the release version
        if: steps.version.outputs.release == 'true' && steps.version.outputs.needs_set == 'true'
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          cargo install cargo-edit@0.13.13 --locked --no-default-features --features set-version
          cargo set-version --workspace "$NEXT"
          cargo update --workspace

      # Dry-run validation only. No artifacts ship to the OIDC job: it
      # repackages the bound commit itself with `cargo package --no-verify`,
      # which collects manifest-declared files without compiling or running
      # build scripts.
      - name: Package
        if: steps.version.outputs.release == 'true'
        env:
          EXCLUDES: ${{ steps.version.outputs.excludes }}
        run: |
          args=()
          for crate in $EXCLUDES; do args+=(--exclude "$crate"); done
          cargo publish --workspace --dry-run --allow-dirty "${args[@]}"

      # The release train (default branch) reads this data-only file for the
      # candidate and a skip pre-filter; it lands for every trigger so the
      # gate can short-circuit cleanly on unqualified candidates. Nothing
      # here authorizes a publish: the gate derives kind and mode from
      # GitHub-minted run metadata (the event and this job's signed name),
      # and the release job recomputes the version decision from the bound
      # commit. Values still expand from immutable run metadata inline —
      # never from a variable candidate code could persist through
      # $GITHUB_ENV.
      - name: Record the release inputs
        if: always()
        run: |
          mkdir -p target/release-inputs
          cat > target/release-inputs/env <<EOF
          sha=${{ steps.candidate.outputs.sha }}
          branch=${{ steps.candidate.outputs.branch }}
          release=${{ steps.version.outputs.release }}
          kind=${{ github.event_name == 'schedule' && 'train' || 'manual' }}
          mode=${{ github.event_name == 'schedule' && 'dry-run' || inputs.rehearse && 'dry-run' || 'live' }}
          next=${{ steps.version.outputs.next }}
          needs_set=${{ steps.version.outputs.needs_set }}
          excludes=${{ steps.version.outputs.excludes }}
          EOF

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-inputs
          path: Adapters-For-Model-Providers/target/release-inputs/
          retention-days: 7
          if-no-files-found: error
