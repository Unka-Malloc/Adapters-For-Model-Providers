# Generated release train for Adapters-For-Model-Providers.
# Regenerate from the release declaration instead of editing this file by
# hand; .github/release.lock records the source inputs that produced it.
#
# This file holds the only job trusted with the crates.io OIDC identity.
# Registries bind trusted publishing to this filename, which is why the
# OIDC job lives here and not in the candidate-triggered `verify.yml`.
#
# The trust boundary is structural, not a ref condition inside a file a
# caller picked: `workflow_run` is the ONLY trigger, so the workflow file
# that executes under OIDC is always the default branch's copy — a
# dispatched ref can never supply it, which is why there is deliberately
# no workflow_dispatch here. The release job additionally runs in the
# `release` environment: create it once per repository with required
# reviewers and a deployment-branch rule allowing only the default
# branch, and bind crates.io Trusted Publishing to that environment —
# the environment, not the in-file ref check below (kept as a second
# lock), is what confines a dispatch's reach. That shape is an operator
# prerequisite: the gate asserts it on release-bound runs where the
# environment is readable, but a workflow token has no Administration
# scope, so the check can prove a missing environment (404) yet only
# warn on settings it cannot see. To release manually,
# dispatch `verify.yml` on the default branch instead; a live
# (non-rehearsal) run flows into this pipeline and still meets the
# approval gate.
#
# `gate` binds the run itself: live/dry-run and the kind of release are
# derived from metadata GitHub minted — the run's event and its signed
# verify job name — never from the `release-inputs` artifact, whose fields
# a writer left behind by candidate code could rewrite. The artifact
# contributes only the candidate pointer and a skip pre-filter. `release`
# then recomputes the version decision from the bound commit with the
# default-branch helper staged before any candidate checkout: no
# candidate-controlled code executes under the publishing identity.
#
# Credentials: crates.io Trusted Publishing; no stored secret.
name: publish

on:
  workflow_run:
    workflows: ["verify"]
    types: [completed]

permissions: {}

concurrency:
  group: release-train-publish
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      mode: ${{ steps.bind.outputs.mode }}
      sha: ${{ steps.load.outputs.sha }}
      branch: ${{ steps.bind.outputs.ref }}
      release: ${{ steps.load.outputs.release }}
      kind: ${{ steps.bind.outputs.kind }}
      cand: ${{ steps.bind.outputs.cand }}
      input_version: ${{ steps.bind.outputs.input_version }}
      input_level: ${{ steps.bind.outputs.input_level }}
    env:
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: release-inputs
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
          path: release-inputs

      # The inputs file crossed out of a runner that executed candidate
      # code — its fields must be validated as data before any of them may
      # reach the OIDC job. Every key is matched against a strict shape;
      # anything else fails the gate instead of reaching a shell expansion
      # later. Only the candidate pointer (`sha`) and the skip pre-filter
      # (`release`) are used downstream: the decision itself is derived
      # from run metadata below and recomputed inside the release job.
      - id: load
        run: |
          python3 - <<'PY'
          import re, os, sys
          # Only the two fields downstream consumes are required; anything
          # else still fails the shape check rather than reaching a shell.
          # A deps-not-ready or unqualified run reports release="" — that is
          # a clean skip, coerced to false, not a parse failure.
          SHAPES = {
              "sha": r"[0-9a-f]{40}",
              "release": r"(true|false|)",
          }
          fields = {}
          for line in open("release-inputs/env"):
              key, _, value = line.strip().partition("=")
              if not key:
                  continue
              shape = SHAPES.get(key)
              if shape is None or not re.fullmatch(shape, value):
                  raise SystemExit(f"release input fails shape check: {key}={value!r}")
              fields[key] = value
          missing = [k for k in SHAPES if k not in fields]
          if missing:
              raise SystemExit(f"release inputs missing keys: {', '.join(missing)}")
          fields["release"] = "true" if fields["release"] == "true" else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              for key, value in fields.items():
                  out.write(f"{key}={value}\n")
          PY

      # A run is bound only when it executed this repository's real
      # verify.yml file (a same-named workflow file elsewhere does not
      # qualify) and it succeeded. The source ref and the declared
      # candidate are bound separately below: a `verify` workflow
      # modified on a side branch therefore cannot forge a release
      # decision — only a workflow_run of a successful default-branch
      # verify run ever reaches this gate.
      #
      # live/dry-run and the release kind are derived here from metadata
      # GitHub minted — never from the artifact. The verify job's name is
      # rendered by GitHub from the bound workflow file itself, a signature
      # over the run's effective mode and the dispatch inputs that nothing
      # executing inside the run can rewrite: it is the only channel those
      # inputs may cross on. `sig=` pins the wire format — a name that
      # parses under an older or newer version is an explicit refusal, not
      # a misparse. The producer side of this format lives in verify.yml's
      # job `name:` — keep both in sync.
      - name: Bind the run to the verify train
        id: bind
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RUN_ID" in (*[!0-9]*|'') echo "bad run id: ${RUN_ID:-<empty>}"; exit 1;; esac
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
            --jq '{path,conclusion,head_sha,head_branch,event}' > run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[].name]' > jobs.json
          python3 - <<'PY'
          import json, os, re, sys

          def stop(message):
              print(f"::error::{message}")
              sys.exit(1)

          run = json.load(open("run.json"))
          names = json.load(open("jobs.json"))
          if run["path"] != ".github/workflows/verify.yml":
              stop(f"not verify.yml: {run['path']}")
          if run["conclusion"] != "success":
              stop(f"run did not succeed: {run['conclusion']}")

          # Exactly one signed verify job is expected; zero means the run
          # predates the signature, more than one is ambiguous — both fail
          # closed because the inputs cannot be bound.
          TITLE = re.compile(
              r"verify-train \| sig=(?P<sig>\d+)"
              r" \| sched=(?P<sched>dry-run|live)"
              r" \| rehearse=(?P<rehearse>true|false|)"
              r" \| version=(?P<version>\S+)"
              r" \| level=(?P<level>patch|minor|major|)"
              r" \| cand=(?P<cand>[^\s|]+)\Z")
          signed = [m for m in (TITLE.fullmatch(n or "") for n in names) if m]
          if len(signed) != 1:
              stop(f"cannot bind the verify run: {len(signed)} signed job names")
          sig = signed[0]
          if sig["sig"] != "1":
              stop(f"stale signed-name format: sig={sig['sig']}")

          event = run["event"]
          input_version, input_level, cand = "", "patch", "-"
          if event == "schedule":
              # The declared train mode; the scheduled candidate cannot be
              # signed — release.py selects it after the name renders — so
              # the release job re-derives it from the same cutoff instead.
              kind, declared = "train", sig["sched"]
          elif event == "workflow_dispatch":
              kind = "manual"
              if sig["rehearse"] not in ("true", "false"):
                  stop("dispatched verify run carries no rehearsal flag")
              version = sig["version"].removeprefix("v")  # v0.3.0 is accepted
              if version != "-" and not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
                  stop(f"dispatched verify run carries a malformed version {version!r}")
              if not sig["level"]:
                  stop("dispatched verify run carries no bump level")
              input_version = "" if version == "-" else version
              input_level = sig["level"]
              cand = sig["cand"]
              # `sched` is rendered from the same expression RELEASE_MODE ran
              # under; the rehearsal flag it was derived from must agree.
              expected = "dry-run" if sig["rehearse"] == "true" else "live"
              if sig["sched"] != expected:
                  stop("signed effective mode disagrees with the rehearsal flag")
              declared = sig["sched"]
          else:
              stop(f"untrusted verify trigger: {event}")

          # The mode the verify run itself proved is the only mode the
          # publish side ever takes; publishing it live is an operator's
          # dispatch of the non-OIDC verify workflow plus the protected
          # `release` environment's approval, not a flag inside this file.
          mode = declared
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              for key, value in {
                  "mode": mode,
                  "kind": kind,
                  "input_version": input_version,
                  "input_level": input_level,
                  "cand": cand,
                  "ref": run.get("head_branch") or "",
                  "head_sha": run["head_sha"],
              }.items():
                  out.write(f"{key}={value}\n")
          PY

      # Release inputs come only from verify runs on the default branch:
      # any other ref — a release tag included — runs an untrusted
      # revision of the verify workflow, and a pushed tag is only as
      # trustworthy as whoever pushed it. The declared candidate must be
      # the run's head or an ancestor of it — never a diverged or foreign
      # sha. An ancestor is legal only when a separately-signed channel
      # named it: a dispatched verify run whose signature says `cand=-`
      # ran on the run's head commit, so the artifact must be identical to
      # it — any older sha there is a substituted artifact, not the commit
      # verify tested. A signed `cand=` override may name an ancestor; the
      # train's cutoff candidate may be one too, and the release job
      # re-derives that one from the same cutoff and requires equality.
      - name: Bind the source ref to the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          DECLARED_SHA: ${{ steps.load.outputs.sha }}
          RUN_REF: ${{ steps.bind.outputs.ref }}
          RUN_SHA: ${{ steps.bind.outputs.head_sha }}
          KIND: ${{ steps.bind.outputs.kind }}
          SIGNED_CAND: ${{ steps.bind.outputs.cand }}
        run: |
          default='${{ github.event.repository.default_branch }}'
          if [ "$RUN_REF" != "$default" ]; then
            echo "untrusted source ref: ${RUN_REF:-<none>} (expected $default)"
            exit 1
          fi
          if ! status=$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/$DECLARED_SHA...$RUN_SHA" \
            --jq '.status' 2>compare.err); then
            echo "comparing $DECLARED_SHA...$RUN_SHA failed:"
            cat compare.err
            exit 1
          fi
          case "$status" in
            identical|ahead) ;;
            *) echo "candidate $DECLARED_SHA is '$status' of run head $RUN_SHA"
               exit 1 ;;
          esac
          if [ "$KIND" = "manual" ] && [ "$SIGNED_CAND" = "-" ] \
              && [ "$status" != "identical" ]; then
            echo "candidate $DECLARED_SHA is not the dispatched run head $RUN_SHA"
            exit 1
          fi
          echo "source is $default; candidate is $status of the run head"

      # Runs on every bound gate run — rehearsals get the same early
      # warning since every inconclusive path only warns. The default
      # token usually cannot read environment protection rules (a
      # workflow token has no Administration scope), so absence is
      # proven only by a readable enumeration: a 200 environments
      # listing that omits `release` is conclusive and still fails
      # closed — the catastrophic case, since GitHub would create an
      # unprotected one when the release job starts and the approval
      # gate vanishes with no signal. A lone 404 proves nothing:
      # permission walls surface as 404 too. A readable environment
      # gets every facet its payload actually carries asserted.
      # On a live bind every unverifiable path fails closed — an
      # environment this step cannot positively verify may not exist,
      # and proceeding would let GitHub auto-create it unprotected;
      # an operator may set ALLOW_UNVERIFIED_RELEASE_ENV=1 to proceed
      # anyway, an opt-in that is recorded in the log and step summary.
      # Rehearsals warn instead so the gap surfaces before live day.
      - name: Preflight the release environment
        if: steps.load.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BIND_MODE: ${{ steps.bind.outputs.mode }}
          ALLOW_UNVERIFIED_RELEASE_ENV:
            ${{ vars.ALLOW_UNVERIFIED_RELEASE_ENV }}
        run: |
          python3 - <<'PY'
          import fnmatch, json, os, sys, urllib.error, urllib.request

          GUIDE = ("required reviewers plus a deployment-branch rule limited to the "
                   "default branch — create it under Settings → Environments → "
                   "release, then bind crates.io Trusted Publishing to it")
          LIVE = os.environ.get("BIND_MODE") == "live"
          OPT_IN = os.environ.get("ALLOW_UNVERIFIED_RELEASE_ENV") == "1"

          def note(line):
              print(line)
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a") as handle:
                      handle.write(f"release env preflight: {line}\n")

          def stop(message):
              print(f"::error::{message} — {GUIDE}")
              note(f"REFUSED — {message}")
              sys.exit(1)

          def warn(message):
              print(f"::warning::{message}")
              note(f"warned — {message}")
              sys.exit(0)

          def unverified(message):
              # A live release must positively verify the environment's
              # protection; anything less lets a missing or misconfigured
              # environment pass silently. The operator opt-in is loud:
              # it requires a repository variable and names itself here.
              if LIVE and not OPT_IN:
                  stop(f"{message} — live publication cannot positively "
                       f"verify the `release` environment; grant the token "
                       f"Environments read or set the repository variable "
                       f"ALLOW_UNVERIFIED_RELEASE_ENV=1 to proceed unverified")
              warn(f"{message}{' — proceeding unverified by operator opt-in "
                   f"(ALLOW_UNVERIFIED_RELEASE_ENV=1)' if OPT_IN else ''}")

          def get(path):
              headers = {"Accept": "application/vnd.github+json",
                         "X-GitHub-Api-Version": "2022-11-28",
                         "Authorization": f"Bearer {os.environ['GH_TOKEN']}"}
              base = os.environ.get("GITHUB_API_URL", "https://api.github.com")
              request = urllib.request.Request(
                  f"{base}/repos/{os.environ['GITHUB_REPOSITORY']}{path}",
                  headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.status, json.loads(response.read().decode())
              except urllib.error.HTTPError as error:
                  return error.code, None
              except urllib.error.URLError:
                  return 0, None

          default = os.environ["DEFAULT_BRANCH"]
          skipped = []
          status, env = get("/environments/release")
          if status == 404:
              # Absence is conclusive only when the same credential can
              # enumerate the environments list and `release` is not on
              # it; any other answer cannot tell missing from unreadable.
              list_status, listing = get("/environments")
              if list_status == 200:
                  names = [entry.get("name")
                           for entry in (listing or {}).get("environments", [])]
                  if "release" not in names:
                      stop("this repository has no `release` environment — GitHub "
                           "would create an unprotected one when the release job "
                           "starts, silently removing the approval gate")
              unverified(f"the `release` environment could not be verified "
                         f"with this token (environment: HTTP 404, list: "
                         f"HTTP {list_status}); the environment's own "
                         f"protection still applies at job entry")
          elif status in (401, 403):
              unverified(f"cannot read the `release` environment's settings "
                         f"with this token (HTTP {status}); the environment's "
                         f"own protection still applies at job entry")
          elif status == 0:
              unverified("could not reach the environments endpoint "
                         "(transport error); the environment's own "
                         "protection still applies at job entry")
          elif status != 200:
              unverified(f"could not read the `release` environment (HTTP "
                         f"{status}); the environment's own protection still "
                         f"applies at job entry")
          rules = env.get("protection_rules")
          if rules is None:
              skipped.append("required reviewers (payload omits "
                             "protection_rules)")
          elif not any(rule.get("type") == "required_reviewers"
                       and rule.get("reviewers") for rule in rules):
              stop("the `release` environment has no required reviewers")
          policy = env.get("deployment_branch_policy")
          if policy is None:
              skipped.append("deployment-branch rule (payload omits "
                             "deployment_branch_policy)")
          elif not policy.get("protected_branches") \
                  and not policy.get("custom_branch_policies"):
              stop("the `release` environment lets every branch deploy")
          else:
              if policy.get("protected_branches"):
                  code, branch = get(f"/branches/{default}")
                  if code != 200:
                      skipped.append(f"branch protection on `{default}` "
                                     f"(HTTP {code})")
                  elif not branch.get("protected"):
                      stop(f"only protected branches may deploy to `release`, "
                           f"but `{default}` is not a protected branch")
              if policy.get("custom_branch_policies"):
                  code, policies = get(
                      "/environments/release/deployment-branch-policies")
                  if code != 200:
                      skipped.append(f"deployment-branch rules (HTTP {code})")
                  else:
                      names = [p["name"]
                               for p in policies.get("branch_policies", [])]
                      if not any(fnmatch.fnmatchcase(default, name)
                                 for name in names):
                          stop(f"no `release` deployment-branch rule lets the "
                               f"default branch `{default}` deploy "
                               f"(rules: {', '.join(names) or 'none'})")
          if skipped:
              unverified("release environment partially verified — "
                         f"unverified: {'; '.join(skipped)} — confirm them "
                         "under Settings → Environments → release")
          else:
              note("verified — required reviewers and a bounded "
                   "deployment-branch rule are in place")
          PY

  release:
    # Only a completed verify workflow_run reaches this job — there is no
    # dispatch trigger to defend in-file — and the `release` environment is
    # the boundary a reviewer approves: its deployment-branch rule must
    # allow only the default branch, and crates.io Trusted Publishing
    # should be bound to the same environment (registries that reject
    # workflow_run tokens are a registry-side setting the operator fixes
    # once per repository). The ref_type/ref pair stays as a second lock —
    # under workflow_run github.ref is the default branch anyway.
    if: >-
      github.ref_type == 'branch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.event.workflow_run.conclusion == 'success' &&
      needs.gate.outputs.mode == 'live' &&
      needs.gate.outputs.release == 'true'
    needs: gate
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    env:
      RELEASE_MODE: live
      # Pinned for every cargo invocation in this job: a rust-toolchain
      # file in the candidate checkout or inside a packaged crate —
      # including one naming a `path` toolchain with a poisoned bin/cargo —
      # can never select the executable that runs under the OIDC token.
      RUSTUP_TOOLCHAIN: stable
      SIBLINGS: '[]'
      CANDIDATE: ${{ needs.gate.outputs.sha }}
      BRANCH: ${{ needs.gate.outputs.branch }}
      # The declaration's checkout dir, referenced as $DIR inside run
      # blocks and ${{ env.DIR }} in step fields; working-directory keeps
      # the literal because job env cannot reach `defaults`.
      DIR: 'Adapters-For-Model-Providers'
      # Optional registry-index override (repository variable); empty
      # falls through to release.py's documented crates.io default, which
      # the publish step's sparse-index probe shares.
      CARGO_REGISTRY_INDEX: ${{ vars.CARGO_REGISTRY_INDEX }}
    defaults:
      run:
        shell: bash
        working-directory: Adapters-For-Model-Providers
    steps:
      # The default branch is checked out first and its own copy of the
      # train helper staged away — the same pattern verify.yml uses — so
      # the release decision can be recomputed here by code the candidate
      # never supplied. The candidate checkout happens only after the
      # helper is safe in $RUNNER_TEMP.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: ${{ env.DIR }}
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Stage the train helper
        run: cp .github/release.py "$RUNNER_TEMP/release.py"

      # `gate` bound this commit to the verify run's head, so it is already
      # in the full history just fetched; a sha that is not — a rewritten
      # branch — fails the checkout and stops the release.
      - name: Check out the bound candidate
        run: git -c advice.detachedHead=false checkout -q "$CANDIDATE"

      # The artifact may not nominate the candidate itself. For the train
      # the signed name cannot carry it — the cutoff resolves after the
      # name renders — so it is re-derived here from the same cutoff; for a
      # dispatch whose signature names `cand=`, the signed ref is resolved
      # here. Either way the derivation must equal the artifact's claim —
      # a different ancestor is a substituted artifact, not the commit
      # verify tested. A dispatch without `cand=` needed no re-derivation:
      # the gate already required the artifact to be the run's head.
      - name: Re-derive the bound candidate
        if: needs.gate.outputs.kind == 'train' || needs.gate.outputs.cand != '-'
        env:
          RELEASE_KIND: ${{ needs.gate.outputs.kind }}
          OVERRIDE: ${{ needs.gate.outputs.cand }}
        run: |
          override=""
          [ "$OVERRIDE" = "-" ] || override="$OVERRIDE"
          python3 "$RUNNER_TEMP/release.py" candidate \
            --weekday=fri --time=23:59 --utc-offset=+08:00 \
            --default-branch="$BRANCH" --override="$override"
          expected="$(git rev-parse HEAD)"
          if [ "$expected" != "$CANDIDATE" ]; then
            echo "::error::artifact candidate $CANDIDATE is not the re-derived $expected"
            exit 1
          fi
          git checkout -q "$CANDIDATE"

      # An isolated cargo home plus running cargo from outside the checkout
      # keeps a candidate .cargo/config.toml — a credential provider is an
      # executable — from ever loading under the OIDC token. The runner
      # context is unavailable in job env, and this step must run after
      # checkout has created the job's default working directory.
      - run: echo "CARGO_HOME=$RUNNER_TEMP/cargo-home" >> "$GITHUB_ENV"

      # `stable` only: RUSTUP_TOOLCHAIN is pinned above, so a candidate
      # rust-toolchain file can neither select nor install a toolchain here.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # Dependency resolution precedes every cargo step: the workspace
      # cannot package while path-dependency checkouts are missing, so the
      # published-version wait and the sibling checkouts land here, before
      # the first cargo invocation that would resolve them.
      - name: Wait for cross-repository dependencies
        id: deps
        run: python3 "$RUNNER_TEMP/release.py" deps --wait-minutes=150

      # The version decision the verify run reported is candidate-produced
      # data; under the publishing identity it is recomputed from the bound
      # commit by the staged default-branch helper. Registry, tags and pull
      # request labels at release time decide `next`/`excludes`; the only
      # inputs that cross are the dispatch's own, bound through the signed
      # job name in `gate`. A failure here stops the train — the release
      # never falls back to the artifact's numbers.
      - name: Recompute the release decision
        if: steps.deps.outputs.ready == 'true'
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_KIND: ${{ needs.gate.outputs.kind }}
          INPUT_VERSION: ${{ needs.gate.outputs.input_version }}
          INPUT_LEVEL: ${{ needs.gate.outputs.input_level }}
        run: python3 "$RUNNER_TEMP/release.py" version --candidate="$CANDIDATE" --branch="$BRANCH"

      # The bound run declared this candidate releasable; if the decision
      # moved between runs — labels, registry state, a sibling landing —
      # say so instead of exiting green with every release step skipped.
      # Other movement is normal: the recompute is authoritative and its
      # report above shows what it now sees.
      - name: Check the decision did not drift
        if: needs.gate.outputs.release == 'true'
        run: |
          if [ "${{ steps.decide.outputs.release }}" != "true" ]; then
            echo "::error::the bound verify run declared release=true, but recomputing now says no release — the decision drifted between runs"
            exit 1
          fi
          echo "bound run declared release=true; the recompute agrees — it is authoritative for next/excludes." >> "$GITHUB_STEP_SUMMARY"

      # The bump the recomputed decision calls for is applied here:
      # a manifest rewrite driven by cargo metadata — data only, nothing
      # compiles and no candidate script runs under the OIDC token.
      - name: Commit the release version
        if: steps.decide.outputs.release == 'true' && steps.decide.outputs.needs_set == 'true'
        env:
          NEXT: ${{ steps.decide.outputs.next }}
        run: |
          python3 "$RUNNER_TEMP/release.py" set-version "$NEXT"
          (cd "$RUNNER_TEMP" && cargo update --workspace \
            --manifest-path "$GITHUB_WORKSPACE/$DIR/Cargo.toml")
          git add -A -- ':(glob)**/Cargo.toml' ':(glob)**/Cargo.lock'
          # Idempotent resume: if a previous run already promoted this exact
          # bump tree to stable, adopt that commit — a fresh sibling commit
          # would fail the stable push as non-fast-forward before the
          # missing crates can be re-uploaded.
          if [ "$(git write-tree)" = "$(git rev-parse 'origin/stable^{tree}' 2>/dev/null)" ]; then
            git reset --hard -q origin/stable
            echo "stable already carries v$NEXT; reusing its commit"
          else
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qam "release: v$NEXT"
          fi

      # Dependency-first publish order is recomputed from cargo metadata —
      # manifest data, not executed code — so the ordering matches the tree
      # this job checked out and just bumped. Packaging precedes the stable
      # promotion so a package failure cannot leave stable advanced with
      # nothing published.
      - name: Rebuild the release set
        if: steps.decide.outputs.release == 'true'
        env:
          EXCLUDES: ${{ steps.decide.outputs.excludes }}
        run: |
          mkdir -p target/package
          EXCLUDES="$EXCLUDES" python3 "$RUNNER_TEMP/release.py" order \
            > target/package/publish-order.txt
          args=()
          for crate in $EXCLUDES; do args+=(--exclude "$crate"); done
          (cd "$RUNNER_TEMP" && cargo package --workspace --allow-dirty \
            --no-verify --manifest-path "$GITHUB_WORKSPACE/$DIR/Cargo.toml" \
            "${args[@]}")

      # HEAD already carries the version-bump commit when one was applied,
      # so promote HEAD — pushing $CANDIDATE would strand stable on the
      # pre-release commit. Ordered after packaging: stable only moves for
      # a release set that already exists.
      - name: Promote the candidate to stable
        if: steps.decide.outputs.release == 'true'
        run: git push origin "HEAD:refs/heads/stable"

      - name: Authenticate to crates.io
        if: steps.decide.outputs.release == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # The whole upload loop lives in this workflow — the only file the OIDC
      # trust is bound to. The .crate set was packaged locally from the bound
      # commit; tar extracts payloads as data, and `cargo publish --no-verify`
      # uploads them without compiling or running build scripts.
      - name: Publish the release set to crates.io
        if: steps.decide.outputs.release == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          SET: target/package
        run: |
          index_path() {
            case ${#1} in
              1) echo "1/$1";;
              2) echo "2/$1";;
              3) echo "3/${1:0:1}/$1";;
              *) echo "${1:0:2}/${1:2:2}/$1";;
            esac
          }
          # The sparse-index existence probe stays in shell: it is one curl
          # per crate against the registry and cannot be delegated to the
          # staged helper. The endpoint shares release.py's
          # CARGO_REGISTRY_INDEX default — keep them in sync.
          published() { curl -fsSL "${CARGO_REGISTRY_INDEX:-https://index.crates.io}/$(index_path "$1")" | grep -q "\"vers\":\"$2\""; }
          while IFS=$'\t' read -r name vers; do
            [ -n "$name" ] || continue
            if published "$name" "$vers"; then
              echo "$name $vers is already on crates.io"
              continue
            fi
            dir="$(mktemp -d)"
            tar -xzf "$SET/$name-$vers.crate" -C "$dir"
            package="$(find "$dir" -mindepth 1 -maxdepth 1 -type d)"
            rm -f "$package/Cargo.toml.orig"
            # A packaged .cargo/config.toml could name a credential
            # provider or redirect the registry, and a packaged
            # rust-toolchain file could select a `path` toolchain holding a
            # poisoned cargo: strip both. The job-level isolated CARGO_HOME
            # and the pinned RUSTUP_TOOLCHAIN cover the rest.
            rm -rf "$package/.cargo"
            rm -f "$package/rust-toolchain" "$package/rust-toolchain.toml"
            (cd "$package" && cargo publish --no-verify --registry crates-io)
            for _ in $(seq 1 60); do
              published "$name" "$vers" && break
              sleep 10
            done
            published "$name" "$vers" || { echo "::error::crates.io index still lacks $name $vers"; exit 1; }
          done < "$SET/publish-order.txt"

      - name: Tag the release
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.decide.outputs.next }}
        run: |
          git rev-parse -q --verify "refs/tags/v$NEXT" >/dev/null || git tag "v$NEXT"
          git push origin "refs/tags/v$NEXT"
          if ! git push origin "HEAD:refs/heads/release"; then
            echo "::error::release branch not moved: v$NEXT is not a fast-forward of it"
            exit 1
          fi
          gh release view "v$NEXT" >/dev/null 2>&1 ||
            gh release create "v$NEXT" --verify-tag --generate-notes --title "v$NEXT"

      # The bump commit must reach the branch the candidate came from —
      # otherwise the next train's candidate diffs forever against the
      # bumped tag tree and publishes a new patch of unchanged code.
      # $BRANCH is the bound default branch; a literal name cannot follow
      # the repository's own layout.
      - name: Merge the release back into the source branch
        if: steps.decide.outputs.release == 'true'
        env:
          NEXT: ${{ steps.decide.outputs.next }}
        run: |
          git fetch -q origin "$BRANCH"
          if git merge-base --is-ancestor HEAD "origin/$BRANCH"; then exit 0; fi
          git checkout -q -B "$BRANCH" "origin/$BRANCH"
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            merge --no-ff --no-edit "v$NEXT"
          git push origin "$BRANCH"
