name: Publish

on:
  push:
    tags:
      - "*-v[0-9]*"

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Resolve the tagged crate
        id: crate
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          crate="${TAG%-v*}"
          version="${TAG##*-v}"
          actual="$(cargo metadata --no-deps --format-version 1 | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')"
          if [ "$actual" != "$version" ]; then
            echo "::error::tag $TAG does not match workspace crate $crate ($actual)"
            exit 1
          fi
          echo "name=$crate" >> "$GITHUB_OUTPUT"
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CRATE: ${{ steps.crate.outputs.name }}
        run: cargo publish --locked -p "$CRATE"
